name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '21'
          cache: gradle

      # API 키 없이도 빌드와 테스트가 통과해야 한다.
      # 키가 있어야만 검증되는 구조면 기여자가 손댈 수 없다
      - name: Build & test
        working-directory: backend
        run: ./gradlew build -PskipFrontend --no-daemon

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci
      - run: npm run build
